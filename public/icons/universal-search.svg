      <path d="M5.4 6.6H14.2" />
      <path d="M4.6 10H15.2" />
      <path d="M5.4 13.4H12.8" />
    </g>
    <circle cx="10" cy="10" r="6.6" stroke-width="1.9" />
    <path d="M15.2 15.2 21 21" stroke-width="2.6" />
  </g>
</svg>
