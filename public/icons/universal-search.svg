<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Universal Search">
  <title>Universal Search</title>
  <g fill="none" stroke="currentColor" stroke-linecap="round">
    <!-- Records seen through the lens. Drawn as chords of the circle so the icon
